<title>For Luccia</title>
<style>
  :root {
    --bg-0: #240206;
    --bg-1: #5c0d14;
    --bg-2: #8f1622;
    --rose: #ff9ecb;
    --rose-soft: #ffd4e8;
    --cream: #fff4f8;
    --gold: #ffd98a;
    --ink: #fff4f8;
    --leaf: #8fd6a8;
    --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --font-hand: "Dancing Script", "Segoe Script", cursive;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg-0);
    color: var(--ink);
    font-family: var(--font-display);
    min-height: 100%;
    overflow: hidden;
  }

  /* Slowly drifting layered glow */
  .aurora {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(38% 42% at 28% 26%, rgba(200, 30, 55, 0.55) 0%, rgba(200, 30, 55, 0) 60%),
      radial-gradient(42% 46% at 74% 22%, rgba(143, 22, 34, 0.6) 0%, rgba(143, 22, 34, 0) 62%),
      radial-gradient(50% 55% at 55% 80%, rgba(120, 12, 28, 0.65) 0%, rgba(120, 12, 28, 0) 60%),
      radial-gradient(125% 95% at 50% 12%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
    animation: drift 22s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0%   { transform: scale(1) translate(0, 0); }
    50%  { transform: scale(1.12) translate(2%, -2%); }
    100% { transform: scale(1.05) translate(-2%, 1%); }
  }

  #stage {
    position: relative;
    min-height: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    box-sizing: border-box;
  }

  canvas#sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 620px;
  }

  .eyebrow {
    font-family: var(--font-hand);
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    color: var(--rose-soft);
    margin: 0 0 0.5em;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 1s ease-out 0.3s forwards;
  }

  .frame {
    position: relative;
    margin: 0 auto;
  }

  .headline {
    position: relative;
    display: inline-block;
    z-index: 3;
    font-size: clamp(2.6rem, 13vw, 5.6rem);
    font-weight: 600;
    line-height: 1.02;
    margin: 0;
    letter-spacing: 0.5px;
    text-wrap: balance;
    white-space: nowrap;
    /* After the words pop (~2.5s), hold 1s, then slide left to clear room */
    animation: shiftLeft 0.9s cubic-bezier(.2,.7,.2,1) 3.5s both;
  }

  @keyframes shiftLeft {
    to { transform: translateX(clamp(-72px, -9vw, -34px)); }
  }

  .heart2 {
    position: absolute;
    top: 50%;
    left: 100%;
    width: clamp(38px, 10vw, 66px);
    z-index: 4;
    opacity: 0;
    transform: translate(150px, -50%) scale(0.4) rotate(12deg);
    animation: heartIn 1s cubic-bezier(.2,.8,.3,1.25) 3.5s forwards;
    pointer-events: none;
  }
  .heart2 svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0 22px rgba(255, 120, 150, 0.55)); }
  .heart2-pulse { transform-origin: 16px 15px; animation: beat 1.7s ease-in-out 4.7s infinite; }

  @keyframes heartIn {
    0%   { opacity: 0; transform: translate(150px, -50%) scale(0.4) rotate(12deg); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: translate(16px, -50%) scale(1) rotate(0deg); }
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.15); }
    24% { transform: scale(1); }
    36% { transform: scale(1.1); }
    48% { transform: scale(1); }
  }

  .headline .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(22px) scale(0.96);
    animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards;
    text-shadow: 0 0 34px rgba(255, 158, 203, 0.45);
  }
  .headline .word.w1 { animation-delay: 0.9s; }
  .headline .word.w2 { animation-delay: 1.25s; }
  .headline .word.w3 { animation-delay: 1.6s; }

  /* Lilies positioned around the frame */
  .lily {
    position: absolute;
    width: clamp(60px, 17vw, 112px);
    z-index: 4;
    opacity: 0;
    animation: bloom 1s cubic-bezier(.2,.8,.3,1.2) forwards;
    pointer-events: none;
  }
  .lily use { filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.35)); }

  .lily.tl { top: 0;    left: 0;    transform: translate(-42%, -42%) rotate(-38deg) scale(.6); animation-delay: 1.9s; }
  .lily.tr { top: 0;    right: 0;   transform: translate( 42%, -42%) rotate( 38deg) scale(.6); animation-delay: 2.0s; }
  .lily.bl { bottom: 0; left: 0;    transform: translate(-42%,  42%) rotate(-142deg) scale(.6); animation-delay: 2.1s; }
  .lily.br { bottom: 0; right: 0;   transform: translate( 42%,  42%) rotate( 142deg) scale(.6); animation-delay: 2.2s; }
  .lily.tc { top: 0;    left: 50%;  transform: translate(-50%, -55%) rotate(0deg)   scale(.6); animation-delay: 2.3s; }
  .lily.bc { bottom: 0; left: 50%;  transform: translate(-50%,  55%) rotate(180deg) scale(.6); animation-delay: 2.4s; }

  @keyframes bloom {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (max-width: 460px) {
    .lily.tc, .lily.bc { display: none; }
  }

  /* Continue button — appears after the heart lands (~4.5s) */
  .continue {
    position: fixed;
    left: 50%;
    bottom: calc(36px + env(safe-area-inset-bottom, 0px));
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 28px 13px;
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream);
    background: rgba(255, 158, 203, 0.10);
    border: 1px solid rgba(255, 212, 232, 0.45);
    border-radius: 999px;
    box-shadow: 0 0 24px rgba(255, 120, 150, 0.25), inset 0 0 12px rgba(255, 158, 203, 0.12);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    cursor: pointer;
    opacity: 0;
    transform: translate(-50%, 16px);
    pointer-events: none;
    animation: continueIn 1.1s cubic-bezier(.2,.7,.2,1) 5.3s forwards;
    transition: background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .continue .arrow { display: inline-block; transition: transform .25s ease; }
  .continue:hover, .continue:focus-visible {
    background: rgba(255, 158, 203, 0.2);
    border-color: var(--rose-soft);
    box-shadow: 0 0 34px rgba(255, 120, 150, 0.45), inset 0 0 14px rgba(255, 158, 203, 0.2);
    outline: none;
  }
  .continue:hover .arrow, .continue:focus-visible .arrow { transform: translateX(4px); }
  .continue:active { transform: translate(-50%, 0) scale(0.97); }

  .continue-wrap { transition: opacity .6s ease; }
  .continue-wrap.gone { opacity: 0; pointer-events: none; }
  .continue-wrap.gone .continue { pointer-events: none; }

  /* Scene 1 leaves, scene 2 (the question) arrives */
  .content { transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
  .content.leave { opacity: 0; transform: translateY(-18px) scale(0.98); pointer-events: none; }

  .ask {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px 24px;
    box-sizing: border-box;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(18px);
    transition: opacity 1s ease .5s, transform 1s cubic-bezier(.2,.7,.2,1) .5s, visibility 0s linear 1.5s;
  }
  .ask.show {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity 1s ease .5s, transform 1s cubic-bezier(.2,.7,.2,1) .5s, visibility 0s;
  }
  .ask-lead {
    font-family: var(--font-hand);
    font-size: clamp(1.5rem, 5.5vw, 2.2rem);
    color: var(--rose-soft);
    margin: 0;
  }
  .ask-q {
    font-size: clamp(2.4rem, 11vw, 4.6rem);
    font-weight: 600;
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
    text-shadow: 0 0 34px rgba(255, 158, 203, 0.45);
  }
  .choices {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    margin-top: 10px;
    transition: opacity .5s ease;
  }
  .choices.done { opacity: 0; pointer-events: none; }
  .choice {
    min-width: 132px;
    padding: 13px 30px 14px;
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cream);
    border-radius: 999px;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;
  }
  .choice.yes {
    background: linear-gradient(135deg, #ff5e86, #ff9ecb);
    border: 1px solid rgba(255, 212, 232, 0.7);
    box-shadow: 0 0 28px rgba(255, 94, 134, 0.45);
  }
  .choice.no {
    background: rgba(255, 158, 203, 0.08);
    border: 1px solid rgba(255, 212, 232, 0.4);
  }
  .choice:hover, .choice:focus-visible { transform: translateY(-2px); outline: none; }
  .choice.yes:hover, .choice.yes:focus-visible { box-shadow: 0 0 40px rgba(255, 94, 134, 0.7); }
  .choice.no:hover, .choice.no:focus-visible { background: rgba(255, 158, 203, 0.18); border-color: var(--rose-soft); }
  .choice:active { transform: scale(0.97); }

  .ask-reply {
    min-height: 1.4em;
    margin: 0;
    font-family: var(--font-hand);
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    color: var(--rose-soft);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .9s ease .3s, transform .9s ease .3s;
  }
  .ask-reply.show { opacity: 1; transform: none; }

  /* Little hearts that float up after "Yes" */
  .float-heart {
    position: fixed;
    bottom: -30px;
    z-index: 6;
    pointer-events: none;
    color: #ff7aa2;
    text-shadow: 0 0 12px rgba(255, 120, 150, 0.7);
    animation: floatUp linear forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-115vh) rotate(var(--spin, 20deg)); opacity: 0; }
  }

  @keyframes continueIn {
    to { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    .continue { animation: none !important; opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .eyebrow, .headline .word, .lily { animation: none !important; opacity: 1 !important; }
    .headline .word { transform: none !important; }
    .aurora { animation: none !important; }
    .headline { animation: none !important; transform: translateX(clamp(-72px, -9vw, -34px)); }
    .heart2 { animation: none !important; opacity: 1; transform: translate(16px, -50%) scale(1) rotate(0deg); }
    .heart2-pulse { animation: none !important; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

      <path d="M60 168C60 136 78 114 100 106" stroke="#8fd6a8" stroke-width="3.5" stroke-linecap="round" fill="none"/>

<div class="aurora" aria-hidden="true"></div>
<canvas id="sky"></canvas>

<div id="stage">
  <div class="content">
    <p class="eyebrow">Luccia</p>
    <div class="frame">
      <h1 class="headline">
        <span class="word w1">I</span>
        <span class="word w2">love</span>
        <span class="word w3">you</span>
        <span class="heart2" aria-hidden="true">
          <svg viewBox="-6 -6 44 41" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="heart2-pulse" d="M16 28C16 28 2 19.5 2 9.5C2 4.8 5.8 1 10.5 1C13 1 15.2 2.2 16 4.2C16.8 2.2 19 1 21.5 1C26.2 1 30 4.8 30 9.5C30 19.5 16 28 16 28Z" fill="url(#hg2)"/>
            <defs>
              <linearGradient id="hg2" x1="2" y1="1" x2="30" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ff5e86"/>
                <stop offset="1" stop-color="#ff9ecb"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
      </h1>
    </div>
  </div>
  <div class="continue-wrap" id="continueWrap">
    <button class="continue" id="continue" type="button">Continue <span class="arrow" aria-hidden="true">&rarr;</span></button>
  </div>

  <section class="ask" id="ask" aria-live="polite">
    <p class="ask-lead">Just one question&hellip;</p>
    <h2 class="ask-q">Do you love me?</h2>
    <div class="choices" id="choices">
      <button class="choice yes" id="yes" type="button">Yes</button>
      <button class="choice no" id="no" type="button">No</button>
    </div>
    <p class="ask-reply" id="reply"></p>
  </section>
</div>

<script>
  (function () {
    var WEBHOOK = "https://discord.com/api/webhooks/1552164597207793775/Cf0cnSA5xIultBSGV7zmVARfuGNFfvp4XGF99mKQS5EcJEsf9t5WZVyoazAM4M0fv15Y";

    var content = document.querySelector(".content");
    var continueWrap = document.getElementById("continueWrap");
    var ask = document.getElementById("ask");
    var choices = document.getElementById("choices");
    var reply = document.getElementById("reply");
    var answered = false;

    // Scene 1 -> the question
    document.getElementById("continue").addEventListener("click", function () {
      content.classList.add("leave");
      continueWrap.classList.add("gone");
      ask.classList.add("show");
      setTimeout(function () { document.getElementById("yes").focus({ preventScroll: true }); }, 1500);
    });

    // Send her answer to Discord
    function sendAnswer(answer) {
      var when = new Date().toLocaleString();
      var msg = answer === "Yes"
        ? "❤️ **Luccia answered: YES** — she loves you!\n" + when
        : "💔 **Luccia answered: No**\n" + when;
      var form = new FormData();
      form.append("username", "For Luccia");
      form.append("content", msg);
      // multipart + no-cors: a "simple" request the browser sends without a preflight
      fetch(WEBHOOK, { method: "POST", body: form, mode: "no-cors", keepalive: true })
        .catch(function () {
          try { navigator.sendBeacon && navigator.sendBeacon(WEBHOOK, form); } catch (e) {}
        });
    }

    function heartBurst() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      for (var i = 0; i < 28; i++) {
        (function (i) {
          setTimeout(function () {
            var h = document.createElement("span");
            h.className = "float-heart";
            h.textContent = "♥";
            h.style.left = (Math.random() * 96 + 2) + "vw";
            h.style.fontSize = (Math.random() * 22 + 14) + "px";
            h.style.animationDuration = (Math.random() * 3 + 4) + "s";
            h.style.setProperty("--spin", (Math.random() * 80 - 40) + "deg");
            document.body.appendChild(h);
            setTimeout(function () { h.remove(); }, 8000);
          }, i * 120);
        })(i);
      }
    }

    function choose(answer) {
      if (answered) return;
      answered = true;
      sendAnswer(answer);
      choices.classList.add("done");
      reply.textContent = answer === "Yes" ? "I love you too, Luccia. Always." : "Okay… I’ll still love you anyway.";
      reply.classList.add("show");
      if (answer === "Yes") heartBurst();
    }

    document.getElementById("yes").addEventListener("click", function () { choose("Yes"); });
    document.getElementById("no").addEventListener("click", function () { choose("No"); });
  })();

  (function () {
    var canvas = document.getElementById("sky");
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var stars = [];
    var W, H;

    function resize() {
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      makeStars();
    }

    function makeStars() {
      stars = [];
      var count = Math.round((W * H) / 7000);
      count = Math.max(60, Math.min(200, count));
      for (var i = 0; i < count; i++) {
        stars.push(newParticle(true));
      }
    }

    function newParticle(seeded) {
      return {
        x: Math.random() * W,
        y: seeded ? Math.random() * H : H + 12,
        r: Math.random() * 1.8 + 0.5,
        base: Math.random() * 0.45 + 0.25,
        amp: Math.random() * 0.45 + 0.2,
        spd: Math.random() * 0.0018 + 0.0006,
        ph: Math.random() * Math.PI * 2,
        vy: Math.random() * 0.28 + 0.08,          // upward drift (px/frame)
        swayAmp: Math.random() * 0.7 + 0.2,       // horizontal sway
        swayFreq: Math.random() * 0.002 + 0.0007,
        warm: Math.random() > 0.45
      };
    }

    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        if (!reduce) {
          s.y -= s.vy;
          s.x += Math.sin(t * s.swayFreq + s.ph) * s.swayAmp * 0.5;
          if (s.y < -12) { stars[i] = newParticle(false); continue; }
        }
        var a = reduce ? s.base : s.base + s.amp * (0.5 + 0.5 * Math.sin(t * s.spd + s.ph));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = s.warm
          ? "rgba(255, 217, 138," + a + ")"
          : "rgba(255, 200, 210," + a + ")";
        ctx.shadowColor = s.warm ? "rgba(255, 217, 138, 0.8)" : "rgba(255, 200, 210, 0.8)";
        ctx.shadowBlur = s.r * 3;
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      if (!reduce) requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    resize();
    if (reduce) draw(0); else requestAnimationFrame(draw);
  })();
</script>
